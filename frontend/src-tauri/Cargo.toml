[package]
name = "kho-face"
version = "0.1.0"
description = "KHOFace — offline yuz tanish ilovasi"
authors = ["KHO"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kho_face_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tract-onnx = "0.23.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false }
thiserror = "2.0.21"
anyhow = "1.0.104"
parking_lot = "0.12.5"
log = "0.4.34"
bytemuck = "1.25.2"
base64 = "0.23.1"
tauri-plugin-khoface-camera = { path = "plugins/khoface-camera" }
tauri-plugin-fs = "2.6.0"
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }


# Inference (tract, align, matcher) optimallashtirilmagan holda 10–50 marta sekin: dev build
# ham optimallashtiriladi, aks holda debug APK'dagi o'lchovlar ma'nosiz bo'ladi.
# Debug ma'lumoti kamaytirilgan — to'liq bo'lsa, APK 650 MB ga yetadi.
[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
